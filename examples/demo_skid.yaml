# All values are synthetic demonstration data. No proprietary geometry is represented.
title: Synthetic skid tube-routing demonstration
synthetic_data: true
workspace:
  units: mm
  dimensions: [600, 400, 300]
obstacles:
  - type: box
    name: central-process-vessel
    center: [300, 200, 120]
    size: [100, 160, 180]
  - type: cylinder
    name: auxiliary-pump
    center: [430, 90, 80]
    radius: 35
    height: 120
    axis: z
start_port:
  position: [40, 200, 100]
  direction: [1, 0, 0]
end_port:
  position: [560, 200, 100]
  direction: [-1, 0, 0]
tube:
  outer_diameter: 20
  minimum_bend_radius: 40
  minimum_clearance: 20
voxel_resolution: 20
routing_cost_weights:
  bend: 80
  obstacle_proximity: 40
  port_direction: 1000
analysis:
  wall_thickness: 2
  material:
    name: stainless_316
    elastic_modulus_mpa: 193000
    poisson_ratio: 0.3
    yield_strength_mpa: 205
    density_tonne_per_mm3: 8.0e-9
    thermal_expansion_per_k: 1.6e-5
  load_cases:
    - name: design_pressure
      internal_pressure_mpa: 10
    - name: self_weight
      gravity_mm_per_s2: [0, 0, -9810]
    - name: thermal_rise
      temperature_change_k: 30
  mesh:
    circumferential_elements: 16
    minimum_elements_per_bend: 6
    maximum_aspect_ratio: 5
  acceptance:
    stress_safety_factor: 1.5
    maximum_displacement_mm: 1.0
