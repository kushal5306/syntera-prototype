name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CalculiX solver for FEA deck checks
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends calculix-ccx
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - run: python -m syntera.cli demo --config examples/demo_skid.yaml --output outputs/demo
      - name: Solve demo CalculiX decks and apply acceptance thresholds
        run: |
          (cd outputs/demo/fea && for deck in design_pressure self_weight thermal_rise; do ccx -i "$deck"; done)
          python -m syntera.cli fea-evaluate --config examples/demo_skid.yaml --output outputs/demo

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag syntera-prototype:ci .
      - run: docker run --detach --name syntera-ci --publish 8000:8000 syntera-prototype:ci
      - name: Wait for healthy container
        run: |
          for attempt in {1..30}; do
            if [ "$(docker inspect --format='{{.State.Health.Status}}' syntera-ci)" = "healthy" ]; then
              curl --fail http://127.0.0.1:8000/api/health
              exit 0
            fi
            sleep 2
          done
          docker logs syntera-ci
          exit 1
      - name: Convert and read a real DWG through the running container
        run: |
          curl --fail --location --silent --show-error --output example_2018.dwg \
            https://raw.githubusercontent.com/LibreDWG/libredwg/0.13.3/test/test-data/example_2018.dwg
          curl --fail --silent --show-error http://127.0.0.1:8000/api/drawings/capabilities \
            | python3 -c "import json, sys; assert json.load(sys.stdin)['dwg'] is True"
          status=$(curl --silent --show-error --output drawing.json --write-out '%{http_code}' \
            --data-binary @example_2018.dwg --header "Content-Type: application/octet-stream" \
            "http://127.0.0.1:8000/api/drawings?filename=example_2018.dwg")
          if [ "$status" != 200 ]; then
            echo "Upload returned HTTP $status:"; cat drawing.json; echo
            docker cp example_2018.dwg syntera-ci:/tmp/sample.dwg
            docker exec syntera-ci dwg2dxf -y -o /tmp/sample.dxf /tmp/sample.dwg || true
            docker logs syntera-ci | tail -50
            exit 1
          fi
          python3 -c "import json; s = json.load(open('drawing.json')); assert s['conversion']['converter'] == 'libredwg' and s['entity_count'] > 0 and s['dimensions'], s"
