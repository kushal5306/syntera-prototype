[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "syntera-prototype"
version = "0.1.0"
description = "Deterministic tube-routing proof of concept for synthetic industrial skids"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "All rights reserved; licensing is undecided"}
dependencies = [
  "cadquery>=2.5,<2.7",
  "numpy>=1.26,<3",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "matplotlib>=3.8,<4",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.9,<1",
  "httpx>=0.28,<1",
]

[project.scripts]
syntera = "syntera.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/syntera"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
